<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0714"/>
      <stop offset="0.55" stop-color="#140b20"/>
      <stop offset="1" stop-color="#0b0612"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b45"/>
      <stop offset="1" stop-color="#1b112e"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2c1f45"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1020" cy="320" r="360" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="640" fill="url(#acc)"/>

  <!-- right motif: plain-English -> SQL -> database -->
  <g transform="translate(905,214)">
    <!-- speech bubble (english) -->
    <g>
      <rect x="0" y="0" width="120" height="70" rx="14" fill="#1c1230" stroke="#4c3a7a" stroke-width="2"/>
      <path d="M24,70 L24,92 L48,70 Z" fill="#1c1230" stroke="#4c3a7a" stroke-width="2"/>
      <text x="60" y="44" font-size="22" font-weight="700" fill="#c4b5fd" text-anchor="middle">“Ask…”</text>
    </g>
    <!-- arrow -->
    <g stroke="url(#acc)" stroke-width="4" fill="none" stroke-linecap="round">
      <line x1="138" y1="45" x2="196" y2="45"/>
      <path d="M182,33 L198,45 L182,57"/>
    </g>
    <!-- SQL tag -->
    <g transform="translate(210,18)">
      <rect x="0" y="0" width="92" height="54" rx="10" fill="#241539" stroke="url(#acc)" stroke-width="2"/>
      <text x="46" y="35" font-size="22" font-weight="800" fill="#ddd6fe" text-anchor="middle">SQL</text>
    </g>
    <!-- database cylinder -->
    <g transform="translate(112,150)">
      <path d="M-70,0 v96 a70,22 0 0 0 140,0 v-96 z" fill="url(#cyl)" stroke="#4c3a7a" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="70" ry="22" fill="#2a1b45" stroke="url(#acc)" stroke-width="2"/>
      <ellipse cx="0" cy="40" rx="70" ry="22" fill="none" stroke="#4c3a7a" stroke-width="2"/>
      <ellipse cx="0" cy="80" rx="70" ry="22" fill="none" stroke="#4c3a7a" stroke-width="2"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(96,150)">
    <rect x="0" y="-34" width="156" height="30" rx="6" fill="#1c1230" stroke="#4c3a7a"/>
    <text x="16" y="-13" font-size="15" letter-spacing="2" font-weight="600" fill="#a78bfa">AGENTIC · NL → SQL</text>

    <text x="0" y="78" font-size="92" font-weight="800" fill="#f5f3ff" letter-spacing="-1">Sequel</text>
    <text x="2" y="132" font-size="30" font-weight="600" fill="#ddd6fe">Ask your database in plain English.</text>

    <text x="2" y="182" font-size="21" fill="#b9a7ea">An agentic natural-language-to-SQL assistant —</text>
    <text x="2" y="212" font-size="21" fill="#b9a7ea">a question goes in, correct and explained SQL comes out.</text>

    <g font-size="16" font-weight="600" fill="#e4dcff">
      <g transform="translate(0,262)">
        <rect x="0" y="0" width="112" height="38" rx="19" fill="#1c1230" stroke="#4c3a7a"/>
        <text x="20" y="25">NL → SQL</text>
      </g>
      <g transform="translate(124,262)">
        <rect x="0" y="0" width="140" height="38" rx="19" fill="#1c1230" stroke="#4c3a7a"/>
        <text x="20" y="25">Schema-aware</text>
      </g>
      <g transform="translate(276,262)">
        <rect x="0" y="0" width="156" height="38" rx="19" fill="#1c1230" stroke="#4c3a7a"/>
        <text x="20" y="25">Multi-step agent</text>
      </g>
      <g transform="translate(0,310)">
        <rect x="0" y="0" width="176" height="38" rx="19" fill="#1c1230" stroke="#4c3a7a"/>
        <text x="20" y="25">Validated queries</text>
      </g>
      <g transform="translate(188,310)">
        <rect x="0" y="0" width="168" height="38" rx="19" fill="#1c1230" stroke="#4c3a7a"/>
        <text x="20" y="25">Explains results</text>
      </g>
    </g>
  </g>

  <g transform="translate(96,600)" font-size="17" fill="#7a68a6">
    <text x="0" y="0">github.com/Lijithvmv/Sequel</text>
    <text x="1184" y="0" text-anchor="end" fill="#665690">Python</text>
  </g>
</svg>
